name: One-time ClauseBank SEO keyword layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-keyword-layer-once.yml'

permissions:
  contents: write

jobs:
  rewrite-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite SEO metadata only
        shell: python
        run: |
          import re
          from pathlib import Path

          repo = Path('.')

          pages = {
            'mutual-confidentiality-clause': ('雙方保密條款', '保密條款範本', 'Mutual Confidentiality Clause / NDA'),
            'entire-agreement-with-attachments': ('完整合意條款（含附件）', '完整合意條款', 'Entire Agreement Clause'),
            'comprehensive-entire-agreement-and-priority': ('完整合意與文件優先順序', '完整合意條款', 'Entire Agreement and Priority Clause'),
            'entire-agreement-specified-document-carveout': ('完整合意條款（特定文件例外）', '完整合意條款', 'Entire Agreement Carve-out Clause'),
            'transaction-specific-entire-agreement': ('特定交易完整合意條款', '交易完整合意條款', 'Transaction-specific Entire Agreement'),
            'confidentiality-definition-and-obligations': ('機密資訊定義與保密義務', '保密義務條款', 'Confidential Information and Obligations'),
            'cooperation-confidentiality-clause': ('合作保密條款', '合作保密條款', 'Cooperation Confidentiality Clause'),
            'enhanced-mutual-confidentiality-clause': ('加強版雙方保密條款', '雙方保密條款', 'Enhanced Mutual NDA'),
            'project-confidentiality-information-protection': ('專案保密與資訊保護', '專案保密條款', 'Project Confidentiality Clause'),
            'transaction-information-confidentiality': ('交易資訊保密條款', '交易保密條款', 'Transaction Information Confidentiality'),
            'technical-information-confidentiality': ('技術資訊保密條款', '技術保密條款', 'Technical Information Confidentiality'),
            'short-force-majeure-clause': ('不可抗力條款（短版）', '不可抗力條款範本', 'Force Majeure Clause'),
            'comprehensive-force-majeure-clause': ('不可抗力條款（完整版）', '不可抗力條款範本', 'Comprehensive Force Majeure Clause'),
            'short-entire-agreement-clause': ('完整合意條款（短版）', '完整合意條款', 'Short Entire Agreement Clause'),
            'governing-law-jurisdiction-taiwan': ('台灣準據法與管轄條款', '準據法條款', 'Governing Law and Jurisdiction Clause'),
            'governing-law-non-exclusive-jurisdiction-taiwan': ('台灣準據法與非專屬管轄', '管轄法院條款', 'Non-exclusive Jurisdiction Clause'),
            'governing-law-jurisdiction-taiwan-no-consultation': ('台灣準據法與管轄（無協商期）', '準據法與管轄條款', 'Governing Law and Jurisdiction'),
            'governing-law-exclusive-jurisdiction-taiwan-consultation-period': ('台灣準據法與專屬管轄（協商期）', '專屬管轄條款', 'Exclusive Jurisdiction Clause'),
            'taiwan-arbitration-clause': ('台灣仲裁條款', '仲裁條款範本', 'Taiwan Arbitration Clause'),
            'public-contract-mediation-arbitration-taiwan': ('政府採購調解與仲裁條款', '政府採購仲裁條款', 'Public Contract Mediation and Arbitration'),
            'breach-remedies-cure-period': ('違約補正與救濟條款', '違約條款範本', 'Breach Remedies and Cure Period'),
            'material-breach-immediate-termination': ('重大違約立即終止條款', '重大違約條款', 'Material Breach Immediate Termination'),
            'continuing-breach-suspension-termination': ('持續違約、暫停與終止', '持續違約條款', 'Continuing Breach Suspension Termination'),
            'construction-default-and-remedies': ('工程違約與救濟條款', '工程違約條款', 'Construction Default and Remedies'),
            'investment-breach-remedies': ('投資契約違約與救濟', '投資契約違約條款', 'Investment Breach Remedies'),
            'breach-notice-suspension-damages': ('違約通知、暫停與損害賠償', '違約通知條款', 'Breach Notice Suspension Damages'),
            'mutual-damages-clause': ('雙向損害賠償條款', '損害賠償條款範本', 'Mutual Damages Clause'),
            'unilateral-damages-clause': ('單向損害賠償條款', '損害賠償條款範本', 'Unilateral Damages Clause'),
            'fixed-or-percentage-liquidated-damages': ('固定額或比例違約金', '違約金條款範本', 'Liquidated Damages Clause'),
            'daily-contractual-penalty-default-interest': ('按日違約金與遲延利息', '按日違約金條款', 'Daily Penalty and Default Interest'),
            'loan-default-liquidated-damages': ('借款違約金條款', '借款違約金條款', 'Loan Default Liquidated Damages'),
            'mutual-termination-for-convenience': ('雙方任意終止條款', '任意終止條款', 'Mutual Termination for Convenience'),
            'unilateral-termination-for-convenience': ('單方任意終止條款', '單方終止條款', 'Unilateral Termination for Convenience'),
            'termination-for-breach-cure-period': ('違約終止與補正期間', '違約終止條款', 'Termination for Breach Cure Period'),
            'effects-of-termination': ('契約終止效果條款', '契約終止條款', 'Effects of Termination'),
            'general-invoicing-payment-terms': ('一般請款與付款條件', '付款條件條款', 'Invoicing and Payment Terms'),
            'milestone-payment-terms': ('里程碑付款條款', '分期付款條款', 'Milestone Payment Terms'),
            'monthly-service-fee-payment-terms': ('月服務費付款條款', '服務費付款條款', 'Monthly Service Fee Payment Terms'),
            'annual-prepayment-terms': ('年度預付款條款', '預付款條款', 'Annual Prepayment Terms'),
            'pre-existing-intellectual-property-rights': ('既有智慧財產權條款', '智慧財產權條款範本', 'Pre-existing Intellectual Property Rights'),
            'commissioned-works-intellectual-property-rights': ('委託成果智慧財產權條款', '委託成果著作權條款', 'Commissioned Works Intellectual Property'),
            'licensed-content-intellectual-property-rights': ('授權內容智慧財產權條款', '授權智慧財產權條款', 'Licensed Content Intellectual Property'),
            'business-cooperation-intellectual-property-rights': ('商業合作智慧財產權條款', '合作智慧財產權條款', 'Business Cooperation IP Clause'),
            'construction-extension-of-time-force-majeure': ('工程展延與不可抗力', '工程不可抗力條款', 'Construction Extension of Time Force Majeure'),
            'direct-damages-only-liability-limitation': ('僅限直接損害責任限制', '責任限制條款', 'Direct Damages Liability Limitation'),
            'contract-price-liability-cap': ('以契約價金為責任上限', '賠償責任上限條款', 'Contract Price Liability Cap'),
            'liability-cap-willful-misconduct-carveouts': ('責任上限與故意行為例外', '責任上限條款', 'Liability Cap Willful Misconduct Carve-outs'),
            'purchase-price-liability-cap-consequential-damages': ('買價責任上限與間接損害排除', '損害賠償責任上限', 'Purchase Price Liability Cap'),
            'liability-cap-confidentiality-ip-carveouts': ('責任上限與保密／智財例外', '責任限制例外條款', 'Liability Cap Confidentiality IP Carve-outs'),
            'twelve-month-fees-liability-cap': ('十二個月費用責任上限', '服務費責任上限條款', 'Twelve-month Fees Liability Cap'),
            'good-faith-performance-clause': ('誠信履約條款', '誠信條款', 'Good Faith Performance Clause'),
            'unilateral-business-integrity-anti-bribery': ('單向商業誠信與反賄賂', '反賄賂條款', 'Unilateral Business Integrity Anti-bribery'),
            'mutual-business-integrity-anti-bribery': ('雙向商業誠信與反賄賂', '誠信反賄賂條款', 'Mutual Business Integrity Anti-bribery'),
            'anti-bribery-aml-sanctions-compliance': ('反賄賂、洗錢防制與制裁遵循', '反賄賂合規條款', 'Anti-bribery AML Sanctions Compliance'),
            'no-guaranteed-results-disclaimer': ('不保證結果免責聲明', '免責聲明範本', 'No Guaranteed Results Disclaimer'),
            'third-party-services-disclaimer': ('第三方服務免責聲明', '第三方服務免責條款', 'Third-party Services Disclaimer'),
            'website-saas-service-disclaimer': ('網站／SaaS服務免責聲明', '網站免責聲明範本', 'Website SaaS Service Disclaimer'),
            'assignment-prior-written-consent': ('轉讓須事前書面同意', '契約轉讓條款', 'Assignment Prior Written Consent'),
            'assignment-restrictions-successors': ('轉讓限制與繼受人條款', '合約轉讓限制條款', 'Assignment Restrictions Successors'),
            'assignment-affiliate-merger-exception': ('關係企業／併購轉讓例外', '關係企業轉讓條款', 'Affiliate Merger Assignment Exception'),
            'affiliate-assignment-continuing-liability': ('關係企業轉讓與持續責任', '轉讓後責任條款', 'Affiliate Assignment Continuing Liability'),
            'written-notice-clause': ('書面通知條款', '通知條款範本', 'Written Notice Clause'),
            'notice-methods-effective-date': ('通知方式與生效日', '通知生效條款', 'Notice Methods Effective Date'),
            'notice-designated-contacts': ('指定聯絡人通知條款', '契約聯絡人條款', 'Notice Designated Contacts'),
            'returned-mail-deemed-delivered': ('退件視為送達條款', '視為送達條款', 'Returned Mail Deemed Delivered'),
            'messaging-app-notice-deemed-delivered': ('通訊軟體通知視為送達', '通訊軟體通知條款', 'Messaging App Notice Deemed Delivered'),
            'email-notice-twenty-four-hours': ('Email通知24小時視為送達', 'Email通知條款', 'Email Notice 24 Hours'),
            'written-contract-amendments': ('契約書面修改條款', '契約修改條款', 'Written Contract Amendments'),
            'counterparts-and-stamp-tax': ('契約份數與印花稅', '契約份數條款', 'Counterparts and Stamp Tax'),
            'contract-counterparts': ('契約正本份數條款', '契約份數條款', 'Contract Counterparts'),
            'electronic-signatures-counterparts': ('電子簽署與分份簽署', '電子簽名條款', 'Electronic Signatures Counterparts'),
            'electronic-signatures-multiple-counterparts': ('電子簽署與多份正本', '電子簽署條款', 'Electronic Signatures Multiple Counterparts'),
            'contract-headings': ('契約標題不影響解釋', '契約解釋條款', 'Contract Headings'),
            'chinese-language-prevails': ('中文版本優先條款', '中英文契約優先條款', 'Chinese Language Prevails'),
            'matters-not-provided-for': ('未盡事宜條款', '未盡事宜條款', 'Matters Not Provided For'),
            'short-severability-clause': ('可分割性條款（短版）', '可分割性條款', 'Severability Clause'),
            'comprehensive-severability-clause': ('可分割性條款（完整版）', '可分割性條款', 'Comprehensive Severability Clause'),
            'no-implied-waiver': ('不視為權利拋棄', '權利不拋棄條款', 'No Implied Waiver'),
            'cumulative-remedies-no-implied-waiver': ('救濟累積與權利不拋棄', '權利不拋棄條款', 'Cumulative Remedies No Implied Waiver'),
            'exclusivity': ('獨家合作條款', '獨家合作條款', 'Exclusivity Clause'),
            'non-exclusivity': ('非獨家合作條款', '非獨家合作條款', 'Non-Exclusivity Clause'),
          }

          discovered = {
              p.parent.name for p in (repo / 'clausebank').glob('*/index.html')
              if p.parent.name != 'assets'
          }
          if discovered != set(pages):
              missing = sorted(discovered - set(pages))
              extra = sorted(set(pages) - discovered)
              raise SystemExit(f'ClauseBank mapping mismatch. Unmapped={missing}; missing_files={extra}')

          title_re = re.compile(r'<title>.*?</title>', re.S)
          desc_re = re.compile(r'<meta\s+name=["\']description["\']\s+content=["\'].*?["\']\s*/?>', re.S | re.I)
          og_title_re = re.compile(r'<meta\s+property=["\']og:title["\']\s+content=["\'].*?["\']\s*/?>', re.S | re.I)
          og_desc_re = re.compile(r'<meta\s+property=["\']og:description["\']\s+content=["\'].*?["\']\s*/?>', re.S | re.I)
          h1_re = re.compile(r'<h1\b.*?</h1>', re.S | re.I)
          canonical_re = re.compile(r'<link\s+rel=["\']canonical["\']\s+href=["\'].*?["\']\s*/?>', re.S | re.I)

          def replace_once(text, pattern, replacement, label, path):
              new, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one {label}, found {n}')
              return new

          def rewrite_file(path, title, desc):
              old = path.read_text(encoding='utf-8')
              old_body = old.split('</head>', 1)[1]
              old_h1 = h1_re.findall(old)
              old_canonical = canonical_re.findall(old)
              new = old
              new = replace_once(new, title_re, f'<title>{title}</title>', 'title', path)
              new = replace_once(new, desc_re, f'<meta name="description" content="{desc}"/>', 'description', path)
              new = replace_once(new, og_title_re, f'<meta property="og:title" content="{title}"/>', 'og:title', path)
              new = replace_once(new, og_desc_re, f'<meta property="og:description" content="{desc}"/>', 'og:description', path)
              if new.split('</head>', 1)[1] != old_body:
                  raise SystemExit(f'{path}: body changed')
              if h1_re.findall(new) != old_h1:
                  raise SystemExit(f'{path}: H1 changed')
              if canonical_re.findall(new) != old_canonical:
                  raise SystemExit(f'{path}: canonical/URL changed')
              path.write_text(new, encoding='utf-8')
              return old != new

          changed = 0
          for slug, (name, primary, english) in pages.items():
              path = repo / 'clausebank' / slug / 'index.html'
              title = f'{primary}｜中英文合約・契約條款｜金法務在線'
              desc = f'免費提供{name}中英文對照範本，適用商務合約、契約及相關法律文件；可參考{primary}與英文 {english} 寫法。'
              if rewrite_file(path, title, desc):
                  changed += 1

          landing = repo / 'clausebank' / 'index.html'
          landing_title = '免費合約條款・契約條款｜中英文商務條款 ClauseBank｜金法務在線'
          landing_desc = 'ClauseBank 免費中英文合約／契約條款資料庫，提供保密、違約、終止、付款、智慧財產權、準據法、仲裁等商務條款與範本，供合約撰寫與契約審閱參考。'
          if rewrite_file(landing, landing_title, landing_desc):
              changed += 1

          print(f'Validated mapping: {len(pages)} individual clause pages')
          print(f'SEO metadata updated on {changed} ClauseBank files; H1/body/canonical untouched')

      - name: Commit SEO layer
        run: |
          if git diff --quiet; then
            echo 'No SEO metadata changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clausebank/*/index.html clausebank/index.html
          git commit -m 'seo: align ClauseBank metadata with contract search terms'
          git push
